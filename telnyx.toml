# Telnyx Edge Compute — umbrella manifest (telnyx.toml).
# Exports a `fetch` handler + StatefulActor classes; the runtime serves it.
# Distinct from func.toml (which runs its own node:http server). Do not mix.
# Source: https://developers.telnyx.com/docs/edge-compute/stateful-actors/guides/project-structure

name = "servicedesk-ai"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Agenda Actor — one instance per location/day (e.g. main-2026-10-20).
# Owns authoritative occupancy for that date.
[[actors]]
binding = "AGENDA"
type    = "DayAgenda"

# Conversation Actor — one instance per trusted Telnyx conversation.
# Coordinates booking attempts across dates; persists the one-booking-per-
# conversation aggregate (see docs/architecture.md).
[[actors]]
binding = "CONVERSATION_BOOKING"
type    = "ConversationBooking"

# Day Callbacks — one instance per local calendar date (e.g.
# callbacks-2026-10-19) holding the newest 200 callback requests.
# Per-conversation idempotency: the first request in that day wins,
# subsequent requests for the same conversation return the original entry.
[[actors]]
binding = "DAY_CALLBACKS"
type    = "DayCallbacks"

# Metrics — one instance per local day (e.g. metrics-2026-10-20) holding
# counters, latency sums, bounded conversation-id sets and the newest 50
# events for the operator portal. Never holds customer name or phone.
[[actors]]
binding = "METRICS"
type    = "Metrics"

# KV namespace for service catalog + business configuration.
# Created via `telnyx-edge storage kv create --name servicedesk-ai-config`.
# Not available in local `dev` — config loader fails closed (503) without it.
[storage.kv.CONFIG]
id = "533e7681-de0d-4af6-bf4d-1da671f7f5d3"

# Smoke-test authentication secret for /demo/* routes.
# Set independently of TELNYX_API_KEY: `telnyx-edge secrets add SMOKE_TEST_TOKEN <value>`.
# Local `dev` does not emulate secrets — demo routes fail closed (503) without it.
[[secrets]]
binding = "SMOKE_AUTH"
name    = "SMOKE_TEST_TOKEN"

# MCP endpoint bearer token for /mcp. Distinct from SMOKE_AUTH so revocation
# scopes to one surface; stored independently of TELNYX_API_KEY:
#   `telnyx-edge secrets add MCP_API_TOKEN <value>`.
# Local `dev` does not emulate secrets — /mcp fails closed (503) without it.
[[secrets]]
binding = "MCP_AUTH"
name    = "MCP_API_TOKEN"

# Ed25519 public key (base64, 32 bytes) used to verify Telnyx webhook
# signatures on /webhooks/dynamic-variables. Telnyx signs each delivery with
# `${timestamp}|${rawBody}`; the private side lives in Mission Control.
# Stored independently of TELNYX_API_KEY:
#   `telnyx-edge secrets add TELNYX_PUBLIC_KEY <base64-32-bytes>`.
# Local `dev` does not emulate secrets — the webhook fails closed (503) without it.
[[secrets]]
binding = "WEBHOOK_PUBLIC_KEY"
name    = "TELNYX_PUBLIC_KEY"

# Operator portal bearer token for /api/*. Distinct from SMOKE_AUTH and
# MCP_AUTH so the portal can be revoked on its own:
#   `telnyx-edge secrets add PORTAL_API_TOKEN <value>`.
# Local `dev` does not emulate secrets — /api/* fails closed (503) without it.
[[secrets]]
binding = "PORTAL_AUTH"
name    = "PORTAL_API_TOKEN"

# Password for the /call test page (HTTP Basic; the username is ignored).
# Shared with evaluators out of band, never committed:
#   `telnyx-edge secrets add CALL_PAGE_PASSWORD <value>`.
[[secrets]]
binding = "CALL_PAGE_AUTH"
name    = "CALL_PAGE_PASSWORD"

# Telnyx AI Assistant id embedded by the /call web widget. Kept out of the repo
# because anyone who knows it can start a web call billed to the account:
#   `telnyx-edge secrets add TELNYX_ASSISTANT_ID <assistant-...>`.
[[secrets]]
binding = "ASSISTANT_ID"
name    = "TELNYX_ASSISTANT_ID"

# Registered via `telnyx-edge new-func --actor` (2026-10-16).
# Required for `ship`; `dev` and `types` do not need it.
[edge_compute]
func_id   = "a666861a-13f6-4dd3-8955-8201bee7209c"
func_name = "servicedesk-ai"
